<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/party-theme.js"></script>
<title>陪酒小姐 · 預覽 Demo</title>
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/dark.css">
<style>
  body{display:flex;flex-direction:column;height:100vh;}
  .demo-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;background:var(--yellow);font-size:14px;}
  .demo-bar b{font-size:16px;}
  .demo-bar button,.demo-bar select{border:none;border-radius:99px;padding:7px 16px;font-size:14px;font-weight:700;background:#fff;color:var(--ink);cursor:pointer;}
  .demo-bar button:disabled{opacity:.45;cursor:not-allowed;}
  .demo-bar .sp{flex:1;}
  .demo-main{flex:1;min-height:0;display:flex;gap:16px;padding:14px;align-items:stretch;}
  .phone{flex:0 0 392px;max-height:820px;align-self:center;height:100%;border:9px solid var(--ink);border-radius:34px;overflow:hidden;background:#fff;position:relative;}
  .phone>div{height:100%;}
  .hostbox{flex:1;min-width:0;border-radius:14px;overflow:hidden;border:3px solid var(--ink);}
  .hostbox>div{height:100%;}
  @media (max-width:980px){
    body{height:auto;}
    .demo-main{flex-direction:column;padding:0;gap:10px;}
    .phone{flex:none;width:100%;max-width:480px;height:min(820px,100vh);align-self:center;border:none;border-radius:0;}
    .hostbox{flex:none;height:56vw;min-height:230px;}
  }
</style>
</head>
<body>
<div class="demo-bar">
  <b>🃏 陪酒小姐・預覽</b>
  <span>左：手機玩家端　右：中控台（投影畫面）。先加入模擬玩家，再在中控台點名字指定誰來玩（或按「選已進場的」）</span>
  <span class="sp"></span>
  <button id="addBots" disabled>先在左邊進場，再加入其他模擬玩家</button>
  <select id="speed" title="模擬玩家抽牌速度"><option value="3000">模擬速度：慢</option><option value="1500" selected>模擬速度：中</option><option value="400">模擬速度：快</option></select>
</div>
<div class="demo-main">
  <div class="phone"><div id="player"></div></div>
  <div class="hostbox"><div id="host"></div></div>
</div>
<script src="js/bingo-data.js"></script>
<script src="js/bingo-core.js"></script>
<script src="js/store.js"></script>
<script src="js/card-data.js"></script>
<script src="js/card-core.js"></script>
<script src="js/card-store.js"></script>
<script src="js/card-play.js"></script>
<script src="js/party-dnd.js"></script>
<script src="js/card-host.js"></script>
<script>
(function () {
  var B = BINGO_DATA, C = BingoCore, CC = CardCore;
  var store = CardStore.create({ memory: true });          // 預覽版：資料只存在這個頁面裡
  var botIds = {}, latest = { status: "lobby", mode: "roster", players: {}, tables: [] }, scheduled = {};

  CardGame.mountHost(document.getElementById("host"), store, {});
  CardGame.mountPlayer(document.getElementById("player"), store, { persistIdentity: false, isTaken: function (pid) { return !!botIds[pid]; } });

  var addBtn = document.getElementById("addBots"), speed = document.getElementById("speed");
  function humanExists() { return Object.keys(latest.players).some(function (pid) { return !botIds[pid]; }); }

  store.subscribe(function (s) {
    latest = s;
    if (!Object.keys(s.players).length) { botIds = {}; scheduled = {}; }
    var left = B.GUESTS.length - Object.keys(s.players).length;
    addBtn.disabled = !humanExists() || left <= 0;
    addBtn.textContent = !humanExists() ? "先在左邊進場，再加入其他模擬玩家" : (left > 0 ? "加入其他 " + left + " 位模擬玩家" : "模擬玩家已全部加入");
    // 輪到模擬玩家時，過一下子自動抽牌
    if (s.status === "playing") {
      s.tables.forEach(function (tb, t) {
        var d = CC.derive(tb, s.mode);
        if (d.finished || !d.currentPid || !botIds[d.currentPid]) return;
        var key = t + ":" + d.nextIndex;
        if (scheduled[key]) return;
        scheduled[key] = true;
        var pid = d.currentPid, n = d.nextIndex;
        setTimeout(function () { if (latest.status === "playing") store.draw(t, n, pid); }, Number(speed.value) * (0.6 + Math.random() * 0.8));
      });
    }
    // 自由開局的桌子：輪到模擬玩家時也自動抽牌
    Object.keys(s.rooms || {}).forEach(function (id) {
      var room = s.rooms[id], d = CC.derive(room, room.variant);
      if (room.ended || d.finished || !d.currentPid || !botIds[d.currentPid]) return;
      var key = "r:" + id + ":" + d.nextIndex;
      if (scheduled[key]) return;
      scheduled[key] = true;
      var pid = d.currentPid, n = d.nextIndex;
      setTimeout(function () { var r = latest.rooms && latest.rooms[id]; if (r && !r.ended) store.roomDraw(id, n, pid); }, Number(speed.value) * (0.6 + Math.random() * 0.8));
    });
    if (s.status === "lobby") { Object.keys(scheduled).forEach(function (k) { if (k.charAt(0) !== "r") delete scheduled[k]; }); }
  });
  addBtn.addEventListener("click", function () {
    B.GUESTS.forEach(function (g, i) {
      var pid = C.guestId(i);
      if (!latest.players[pid]) { botIds[pid] = true; store.join(pid, g); }
    });
  });
})();
</script>
</body>
</html>
