<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="js/party-theme.js"></script>
<title>入口頁 · 預覽 Demo</title>
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/party.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/award.css">
<link rel="stylesheet" href="css/dark.css">
<style>
  html,body{height:100%;}
  body{display:flex;flex-direction:column;}
  .demo-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--yellow);font-size:14px;}
  .demo-bar b{font-size:16px;}
  .demo-bar select,.demo-bar button{border:none;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:700;background:#fff;color:var(--ink);cursor:pointer;}
  .demo-bar label{display:flex;align-items:center;gap:6px;font-weight:700;}
  .demo-main{flex:1;min-height:0;display:flex;gap:16px;justify-content:center;padding:14px;}
  .phone{flex:0 0 392px;max-width:100%;height:100%;max-height:840px;align-self:center;border:9px solid var(--ink);border-radius:34px;overflow:hidden;background:#fff;position:relative;transform:translateZ(0);}
  .phone>#screen{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .console{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .tabs{flex:0 0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tabs b{font-size:14px;margin-right:4px;}
  .tabs button{border:2px solid var(--blue-mid);background:#fff;color:var(--blue-deep);border-radius:99px;padding:6px 16px;font-size:14px;font-weight:800;cursor:pointer;}
  .tabs button.on{background:var(--yellow);border-color:var(--yellow-border);color:var(--ink);}
  .hostbox{flex:1;min-height:0;border-radius:14px;overflow:hidden;border:3px solid var(--ink);}
  .hostbox>div{height:100%;}
  @media (max-width:980px){
    html,body{height:auto;}
    .demo-main{flex-direction:column;padding:0;gap:10px;}
    .phone{flex:none;width:100%;max-width:480px;height:min(820px,100vh);border:none;border-radius:0;}
    .console{padding:0 8px 14px;}
    .hostbox{flex:none;height:56vw;min-height:230px;}
  }
</style>
</head>
<body>
<div class="demo-bar">
  <b>🎉 入口頁・預覽</b>
  <label>我是<select id="me"></select></label>
  <label>派對解鎖<select id="lock"><option value="open" selected>已解鎖（17:30 之後）</option><option value="locked">未解鎖（看「???」畫面）</option></select></label>
  <label>遊戲狀態<select id="auto"><option value="on" selected>進去就開始玩</option><option value="off">等主持人開始（正式）</option></select></label>
  <button id="before">重來（回到賽前）</button>
  <button id="after">模擬賽後（看我的成績）</button>
</div>
<div class="demo-main">
  <div class="phone"><div id="screen"></div></div>
  <div class="console">
    <div class="tabs"><b>🎛️ 中控台</b>
      <button data-tab="bingo" class="on">好友冰狗</button><button data-tab="quiz">迷因海公牛</button><button data-tab="card">陪酒小姐</button><button data-tab="award">頒獎・總排名</button>
    </div>
    <div class="hostbox"><div id="hostpane"></div></div>
  </div>
</div>

<script src="js/bingo-data.js"></script>
<script src="js/bingo-core.js"></script>
<script src="js/store.js"></script>
<script src="js/quiz-data.js"></script>
<script src="js/quiz-core.js"></script>
<script src="js/quiz-store.js"></script>
<script src="js/card-data.js"></script>
<script src="js/card-core.js"></script>
<script src="js/card-store.js"></script>
<script src="js/award-data.js"></script>
<script src="js/award-core.js"></script>
<script src="js/party-data.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/party-lock.js"></script>
<script src="js/party-pages.js"></script>
<script src="js/bingo-play.js"></script>
<script src="js/quiz-play.js"></script>
<script src="js/card-play.js"></script>
<script src="js/bingo-host.js"></script>
<script src="js/party-dnd.js"></script>
<script src="js/quiz-host.js"></script>
<script src="js/card-host.js"></script>
<script src="js/award-host.js"></script>
<script src="js/demo-seed.js"></script>
<script>
(function () {
  var B = BINGO_DATA, C = BingoCore;
  var stores = { bingo: BingoStore.create({ memory: true }), quiz: QuizStore.create({ memory: true }), card: CardStore.create({ memory: true }) };
  var screen = document.getElementById("screen"), meSel = document.getElementById("me");
  var cur = "hub", live = null;
  var none = document.createElement("option"); none.value = ""; none.textContent = "（尚未簽到）"; meSel.appendChild(none);      // 一開始還沒簽到 → 入口頁會跳出簽到視窗
  B.GUESTS.forEach(function (g, i) { var o = document.createElement("option"); o.value = C.guestId(i); o.textContent = g; meSel.appendChild(o); });
  meSel.value = "";

  var ctx = {
    navigate: go, stores: stores,
    unlocked: function () { return document.getElementById("lock").value !== "locked"; },        // 預覽：切換「已解鎖／未解鎖」
    me: function () { return meSel.value; },
    setMe: function (pid) { meSel.value = pid; }                    // 在入口頁的簽到視窗選了名字
  };
  function go(page) { cur = page; mount(); }
  function mount() {
    if (live && live.destroy) { live.destroy(); } live = null;
    screen.innerHTML = ""; screen.scrollTop = 0;
    var box = document.createElement("div"); box.style.height = "100%"; screen.appendChild(box);
    if (cur === "hub") PartyPages.mountHub(box, ctx);
    else if (cur === "schedule") PartyPages.mountSchedule(box, ctx);
    else if (cur === "info") PartyPages.mountInfo(box, ctx);
    else if (cur === "menu") PartyPages.mountMenu(box, ctx);
    else if (cur === "bingo") { autoStart("bingo"); live = BingoGame.mountPlayer(box, stores.bingo, { persistIdentity: false, initialMe: meSel.value, onBack: function () { go("hub"); } }); }
    else if (cur === "quiz") { autoStart("quiz"); live = QuizGame.mountPlayer(box, stores.quiz, { persistIdentity: false, initialMe: meSel.value, onBack: function () { go("hub"); } }); }
    else if (cur === "card") { autoStart("card"); live = CardGame.mountPlayer(box, stores.card, { persistIdentity: false, initialMe: meSel.value, onBack: function () { go("hub"); } }); }
  }
  // ===== 預覽專用：「進去就開始玩」=====
  // 平常要主持人在中控台按開始，遊戲才會開始。這裡開啟後，一進到遊戲畫面就自動開始，並用程式扮演主持人和其他朋友，方便看效果。
  var autoSel = document.getElementById("auto"), latest = { bingo: null, quiz: null, card: null };
  var Q = QUIZ_DATA, K = QuizCore, CC = CardCore, qDone = {}, cDone = {};
  function isAuto() { return autoSel.value === "on"; }
  function botMs() { return window.DEMO_BOT_MS || 1500; }
  function nextMs() { return window.DEMO_NEXT_MS || 4000; }
  ["bingo", "quiz", "card"].forEach(function (k) { stores[k].subscribe(function (s) { latest[k] = s; }); });
  function allPids() { return B.GUESTS.map(function (g, i) { return C.guestId(i); }); }

  function autoStart(page) {
    if (!isAuto()) return;
    if (page === "bingo" && latest.bingo.status === "lobby") stores.bingo.setStatus("playing", { durationSec: 600 });
    if (page === "quiz" && latest.quiz.status === "lobby") {
      B.GUESTS.forEach(function (g, i) { stores.quiz.join(C.guestId(i), g); });
      if (!K.assignedPids(latest.quiz).length) {                         // 還沒分組：隨機分成 4 組（我也在其中）
        var pool = allPids().sort(function () { return Math.random() - 0.5; }), asg = {};
        pool.forEach(function (pid, i) { asg[pid] = i % 4; });
        stores.quiz.setTeams(4, asg);
      }
      stores.quiz.startQuestion(K.firstIndex(), K.defaultSeconds(K.firstIndex()));
    }
    if (page === "card" && latest.card.status === "lobby") {
      B.GUESTS.forEach(function (g, i) { stores.card.join(C.guestId(i), g); });
      stores.card.start({ mode: "roster", scoring: "first", tables: [{ order: allPids(), deck: CC.makeDeck(), variant: CC.variantFor(allPids().length) }] });
    }
  }

  // 問答：自動揭曉、自動下一題，其他朋友隨機作答
  stores.quiz.subscribe(function (s) {
    if (s.status === "lobby") qDone = {};
    if (s.status === "intro" && !qDone["i" + s.index]) {                 // 分類封面：2.5 秒後自動出題
      qDone["i" + s.index] = true; var ii = s.index;
      setTimeout(function () { if (latest.quiz.status === "intro" && latest.quiz.index === ii) stores.quiz.startQuestion(ii, K.defaultSeconds(ii)); }, 2500);
    }
    if (s.status === "question" && K.startOf(s, s.index) && !qDone["r" + s.index]) {
      qDone["r" + s.index] = true;
      var idx = s.index, q = Q.QUESTIONS[idx], secs = K.secondsFor(idx, s), dur = (secs || 12) * 1000;
      var wait = Math.max(0, K.startOf(s, idx) + dur - Date.now()), buzz = q.type === "buzz";
      if (buzz) wait = K.buzzDelay() * 1000 + 5000;
      setTimeout(function () {
        var cur = latest.quiz; if (cur.status !== "question" || cur.index !== idx) return;
        if (buzz) { var first = K.buzzList(cur, idx)[0]; if (first && first.pid !== meSel.value) stores.quiz.judge(idx, first.pid, Math.random() < 0.7); }
        if (!secs || buzz) stores.quiz.reveal(idx);                    // 不倒數的題目：程式扮演主持人按揭曉
      }, wait + 250);
      allPids().forEach(function (pid) {
        if (pid === meSel.value) return;
        if (buzz) {
          if (Math.random() < 0.5) setTimeout(function () { var cur = latest.quiz; if (cur.status === "question" && cur.index === idx) stores.quiz.buzz(pid, idx); }, K.buzzDelay() * 1000 + 300 + Math.random() * 3500);
          return;
        }
        setTimeout(function () {
          var cur = latest.quiz; if (cur.status !== "question" || cur.index !== idx) return;
          var n = q.options.length, ch = q.answer;
          if (Math.random() >= 0.65) { do { ch = Math.floor(Math.random() * n); } while (ch === q.answer); }
          stores.quiz.answer(pid, idx, ch);
        }, 600 + Math.random() * Math.max(400, dur - 1500));
      });
    }
    if (s.status === "reveal" && !qDone["n" + s.index]) {
      qDone["n" + s.index] = true; var ri = s.index;
      setTimeout(function () {
        if (latest.quiz.status !== "reveal" || latest.quiz.index !== ri) return;
        var nx = K.nextIndex(ri);
        if (nx < 0) stores.quiz.end();
        else if (K.isCatStart(nx)) stores.quiz.showIntro(nx);
        else stores.quiz.startQuestion(nx, K.defaultSeconds(nx));
      }, nextMs());
    }
  });

  // 陪酒小姐：輪到其他朋友時自動抽牌（輪到自己要自己按）
  function driveCard(s) {
    if (s.status === "lobby") { cDone = {}; return; }
    if (s.status !== "playing") return;
    s.tables.forEach(function (tb, t) {
      var d = CC.derive(tb, s.mode);
      if (d.finished || !d.currentPid || d.currentPid === meSel.value) return;
      var key = t + ":" + d.nextIndex; if (cDone[key]) return; cDone[key] = true;
      var pid = d.currentPid, n = d.nextIndex;
      setTimeout(function () { if (latest.card.status === "playing") stores.card.draw(t, n, pid); }, botMs() * (0.6 + Math.random() * 0.8));
    });
  }
  stores.card.subscribe(driveCard);

  meSel.addEventListener("change", function () { cDone = {}; mount(); driveCard(latest.card); });
  document.getElementById("lock").addEventListener("change", function () { cur = "hub"; mount(); });
  document.getElementById("before").addEventListener("click", function () { stores.bingo.reset(); stores.quiz.clearAll(); stores.card.reset(); cDone = {}; qDone = {}; mount(); });
  document.getElementById("after").addEventListener("click", function () { DemoSeed.seedFinished(stores.bingo, stores.quiz); mount(); });
  // 右邊的中控台：跟左邊的手機用同一份資料，所以可以真的按「開始」「揭曉」「下一題」
  var tabBtns = [].slice.call(document.querySelectorAll(".tabs button")), hostpane = document.getElementById("hostpane");
  function mountHostPane(tab) {
    tabBtns.forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === tab); });
    hostpane.innerHTML = ""; var box = document.createElement("div"); box.style.height = "100%"; hostpane.appendChild(box);
    if (tab === "bingo") BingoGame.mountHost(box, stores.bingo, {});
    else if (tab === "quiz") QuizGame.mountHost(box, stores.quiz, {});
    else if (tab === "card") CardGame.mountHost(box, stores.card, {});
    else if (tab === "award") AwardGame.mountHost(box, { bingo: stores.bingo, quiz: stores.quiz, card: stores.card }, {});
  }
  tabBtns.forEach(function (b) { b.addEventListener("click", function () { mountHostPane(b.getAttribute("data-tab")); }); });
  mountHostPane("bingo");
  window.demo = { go: go, stores: stores, mount: mount, hostTab: mountHostPane };
  mount();
})();
</script>
</body>
</html>
